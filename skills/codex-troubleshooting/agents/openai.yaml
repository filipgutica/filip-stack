interface:
  display_name: "Codex Troubleshooting"
  short_description: "Debug Codex app, CLI, plugin, hook, MCP, and browser issues"
  default_prompt: "Use $codex-troubleshooting to check current official Codex docs, then inspect local Codex state and logs before diagnosing the issue."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "openaiDeveloperDocs"
      description: "OpenAI Docs MCP server"
      transport: "streamable_http"
      url: "https://developers.openai.com/mcp"
