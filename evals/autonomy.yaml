# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Autonomy guidance - who settles an open decision
prompts:
  - id: file://host-guidance.mjs:baseGuidance
    label: base
  - id: file://host-guidance.mjs:headGuidance
    label: working tree
providers: file://providers.yaml
tests: file://host-guidance.mjs:autonomyTests
defaultTest:
  assert:
    - type: javascript
      value: file://host-guidance.mjs:scoreAutonomy
