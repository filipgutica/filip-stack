name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/site/src/content/**"
      - "README.md"
      - "skills/*/SKILL.md"
      - "plugins/*/skills/*/SKILL.md"
      - "plugins/*/skills/*/references/**"
      - "skills/*/references/**"
      - "skills/*/THIRD_PARTY_NOTICES.md"
      - "plugins/*/THIRD_PARTY_NOTICES.md"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - "docs/site/src/content/**"
      - "README.md"
      - "skills/*/SKILL.md"
      - "plugins/*/skills/*/SKILL.md"
      - "plugins/*/skills/*/references/**"
      - "skills/*/references/**"
      - "skills/*/THIRD_PARTY_NOTICES.md"
      - "plugins/*/THIRD_PARTY_NOTICES.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: docs/site/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The build validates README tables, skill directories, and page content.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: github.event_name != 'pull_request'
        with:
          path: docs/site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
