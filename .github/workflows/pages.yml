name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/site/src/content/**"
      - "README.md"
      - "skills/*/SKILL.md"
      - "plugins/*/skills/*/SKILL.md"
      - "plugins/*/skills/*/references/**"
      - "skills/*/references/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - "docs/site/src/content/**"
      - "README.md"
      - "skills/*/SKILL.md"
      - "plugins/*/skills/*/SKILL.md"
      - "plugins/*/skills/*/references/**"
      - "skills/*/references/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: docs/site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The build validates README tables, skill directories, and page content.
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: docs/site/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
