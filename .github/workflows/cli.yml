name: CLI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Check the packaged CLI
        run: |
          node --test tests/host-config/cli.test.mjs
          node --test tests/host-config/sync.test.mjs
          node cli/filip-stack.mjs --version
