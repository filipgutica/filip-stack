commit-msg:
  commands:
    commitlint:
      # An absolute path: commitlint resolves a relative one against the first .git it finds going up, which in a nested checkout can be an outer worktree's.
      run: case {1} in /*) msg={1} ;; *) msg="$PWD/{1}" ;; esac; npx --no-install commitlint --edit "$msg"
