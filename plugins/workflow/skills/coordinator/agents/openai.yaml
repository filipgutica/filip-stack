interface:
  display_name: "Coordinator"
  short_description: "Coordinate plan and implementation workflows"
  default_prompt: "Use $workflow:coordinator for broad engineering orchestration. Coordinate plan-only work through Plan Coordination, approved implementation through Implementation Coordination using $workflow:minimal-code as the default implementation lens, route pure written plans to superpowers:writing-plans when available, say when Superpowers is unavailable and fall back to default planning behaviour, use a separate read-only critic before accepting meaningful edits, and finish meaningful edits with $workflow:review-cycle."
policy:
  allow_implicit_invocation: true
