interface:
  display_name: "Coordinator"
  short_description: "Coordinate authorized engineering execution"
  default_prompt: "Use $workflow:coordinator for authorized engineering implementation. Keep Plan Mode as discussion or artifact planning without implementation authority; use a bounded goal-evidence-risk-review-verify cycle for meaningful work, select one proportionate review tier, and use $workflow:review-cycle as the main-thread diff and evidence gate. Use branch ledgers, task commits, push, and draft PRs only for explicitly authorized named-ticket end-to-end execution."
policy:
  allow_implicit_invocation: true
