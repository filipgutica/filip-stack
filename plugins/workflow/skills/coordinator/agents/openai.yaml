interface:
  display_name: "Coordinator"
  short_description: "Route engineering work by authority and evidence"
  default_prompt: "Use $workflow:coordinator to route engineering work through Planning, Investigation, or explicitly authorized Implementation. Planning may use a user-involved external branch ledger only when explicitly requested for an established branch; it cannot edit source, commit, or publish. Investigation follows explore, hypothesize, focused repro, validate or revise, then present. Implementation uses a bounded goal-evidence-risk-review-verify cycle and $workflow:review-cycle; branch ledgers, task commits, push, and draft PRs require explicit named-ticket end-to-end authority."
policy:
  allow_implicit_invocation: true
