interface:
  display_name: "Coordinator"
  short_description: "Route engineering work by type and authority"
  default_prompt: >-
    Use $workflow:coordinator to route work through Planning, Investigation, or
    authorized Implementation. Planning and Investigation are read-only for
    repository files. Review feedback does not grant implementation or
    publishing authority. Named-work-item end-to-end authority applies to a
    ticket, specification, or plan. It permits branch setup, ledger and pointer
    maintenance, a selected agent walkthrough for branch-level integration risk,
    bounded commits, push, and a draft pull request.
policy:
  allow_implicit_invocation: true
