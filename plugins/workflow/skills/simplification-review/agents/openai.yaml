interface:
  display_name: "Simplification Review"
  short_description: "Review scoped code for safe simplification and cleanup"
  default_prompt: "Review local changes first. Use the branch diff when no local changes exist. Keep the review within the selected scope. Run focused Fallow checks first for supported code. For non-tiny scopes, run parallel read-only Quality, Reuse, and Efficiency passes. Return one severity-ranked report without editing code."
