interface:
  display_name: "Review Cycle"
  short_description: "Gate meaningful edits with final diff and evidence review"
  default_prompt: "Use $workflow:review-cycle after meaningful edits and before a final response, commit, pull request, or broad verification. Inspect scope, complexity, test changes, public metadata, and verification. Confirm that the coordinator used one proportionate review tier. Add no extra reviewer. Repeat independent review only after a material change."

policy:
  allow_implicit_invocation: true
