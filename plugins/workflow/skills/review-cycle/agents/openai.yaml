interface:
  display_name: "Review Cycle"
  short_description: "Review meaningful edits through acceptance and verification"
  default_prompt: >-
    Use $workflow:review-cycle after meaningful edits. Inspect the current diff,
    compare it with the active slice, and preserve unrelated user changes.
    Inspect review coverage and verification evidence. Reuse a completed review
    while it covers the diff and risk. Run a missing standard or adversarial
    review. Repeat review only after a material coverage or risk change. Apply
    valid findings, rerun affected checks, and present the user acceptance
    checkpoint when the selected route requires it.

policy:
  allow_implicit_invocation: true
